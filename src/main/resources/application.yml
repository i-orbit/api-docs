spring:
  application:
    name: api-docs
server:
  port: 30700
knife4j:
  enableAggregation: true
  cloud:
    enable: true
    routes:
      - name: core
        uri: core:30701
        location: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
