apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-docs
  namespace: orbit
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api-docs
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api-docs
          port: 30700
